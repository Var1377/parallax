[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Var1377"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Var1377/parallax"

[workspace.dependencies]
# Incremental compilation
salsa = "0.23"
rustc-hash = "2.1"

# Error handling and diagnostics
ariadne = "0.5"
thiserror = "2.0"
anyhow = "1.0"

# Parsing
logos = "0.15"  # Fast lexer generator
rowan = "0.16"  # Lossless syntax tree (used by rust-analyzer)

# Performance and parallelism
rayon = "1.10"
dashmap = "6.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Data structures
indexmap = "2.10"
smallvec = "1.13"
bumpalo = "3.19"  # Arena allocator

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.21"

# Serialization (for caching)
serde = { version = "1.0", features = ["derive"] }
bincode = "2.0"

# Testing
insta = { version = "1.43", features = ["yaml"] }
expect-test = "1.5"
proptest = "1.7"
criterion = "0.6"

# Development dependencies
[workspace.dev-dependencies]
pretty_assertions = "1.4"